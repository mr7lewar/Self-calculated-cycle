<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СРЦ-14 · Троєборство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1b2027; --panel2:#20262f; --line:#2b323c;
  --chalk:#e9e7e1; --muted:#878f9b; --dim:#5b636e;
  --red:#d8453a; --amber:#e3a23a; --green:#52a575; --blue:#5b8bd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--chalk);font-family:'Inter',system-ui,sans-serif;
  line-height:1.5;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* Header */
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171b21,#14171c);
  position:relative;overflow:hidden}
.hbar{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 0 20px;gap:16px;flex-wrap:wrap}
.title{font-family:'Oswald';font-weight:700;font-size:clamp(30px,7vw,52px);letter-spacing:.02em;line-height:.95;text-transform:uppercase}
.title .red{color:var(--red)}
.sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.cyclechip{font-family:'Oswald';font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* PM strip */
.pmstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 0 18px}
.pm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:104px}
.pm .lab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.pm .val{font-family:'Oswald';font-weight:700;font-size:24px;line-height:1.1}
.pm .val small{font-size:13px;color:var(--dim);font-weight:500}
.editpm{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--chalk);
  font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase;font-size:13px;
  padding:10px 16px;border-radius:10px;cursor:pointer;transition:.15s}
.editpm:hover{border-color:var(--red);color:var(--red)}

/* Nav */
nav{position:sticky;top:0;z-index:30;background:rgba(20,23,28,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.navin{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;max-width:880px;margin:0 auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;background:transparent;border:none;color:var(--muted);font-family:'Oswald';
  font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.12s}
.nb:hover{color:var(--chalk)}
.nb.active{background:var(--panel2);color:var(--chalk)}
.nb.active.peak{color:var(--amber)} .nb.active.deload{color:var(--green)}
.nb .dotmark{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle}

/* Content */
main{padding-top:22px}
.viewhead{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px}

/* Overview */
.lead{font-size:15px;color:#c3c8d0;max-width:660px;margin-bottom:22px}
.phasebar{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.phasebar div{flex:1;text-align:center;font-family:'Oswald';font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 2px;color:var(--bg);font-weight:600}
.legendrow{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 26px}
.legendrow b{color:var(--chalk);font-weight:600}
.wavewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 14px 10px;margin-bottom:26px}
.wavetitle{font-family:'Oswald';font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px 8px}
.tabs{display:flex;gap:6px;padding:0 4px 12px}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'Oswald';
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:7px;cursor:pointer}
.tab.active{border-color:transparent;color:var(--bg);font-weight:600}
canvas{width:100%;height:auto;display:block}

.pattern{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:26px}
@media(min-width:620px){.pattern{grid-template-columns:1fr 1fr}}
.pcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:14px 16px}
.pcard h4{font-family:'Oswald';font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.pcard p{font-size:13.5px;color:#b9bec7}
.pcard .f{font-family:'JetBrains Mono';font-size:12.5px;color:var(--amber);margin-top:7px;display:block}

/* progress overview */
.mcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.mctile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:.12s}
.mctile:hover{border-color:var(--muted)}
.mctile .n{font-family:'Oswald';font-weight:700;font-size:20px}
.mctile .ring{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);margin-top:3px}
.mctile.done{border-color:var(--green)} .mctile.done .ring{color:var(--green)}

/* Session cards */
.session{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.snum{font-family:'Oswald';font-weight:700;font-size:15px;background:var(--bg);border:1px solid var(--line);
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stitle{font-family:'Oswald';font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.smeta{margin-left:auto;font-family:'JetBrains Mono';font-size:11px;color:var(--muted);text-align:right}
.ex{padding:13px 16px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.exname{font-weight:600;font-size:15px}
.exgrp{font-family:'Oswald';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);
  padding:2px 6px;border-radius:4px;font-weight:600}
.exload{margin-left:auto;font-family:'Oswald';font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:7px}
.setbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;cursor:pointer;transition:.12s;user-select:none}
.setbox:hover{border-color:var(--muted)}
.setbox.done{border-color:var(--green);background:rgba(82,165,117,.09)}
.setbox .ck{width:17px;height:17px;border:1.5px solid var(--dim);border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.setbox.done .ck{border-color:var(--green);background:var(--green);color:#fff}
.setbox .kg{font-family:'Oswald';font-weight:700;font-size:19px;line-height:1}
.setbox .kg small{font-size:11px;color:var(--dim);font-weight:500}
.setbox .rs{font-family:'JetBrains Mono';font-size:12px;color:var(--muted)}
.setbox .pc{font-family:'JetBrains Mono';font-size:10px;color:var(--dim)}
.setbox.heavy .kg{color:var(--amber)}
.cmt{margin-top:9px;font-size:12px;color:var(--dim);font-style:italic}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,10,13,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px}
.modal h3{font-family:'Oswald';font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.modal .hint{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.45}
.fld{margin-bottom:14px}
.fld label{display:block;font-family:'Oswald';font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--chalk);
  font-family:'JetBrains Mono';font-size:18px;font-weight:700;padding:11px 13px;border-radius:9px}
.fld input:focus{outline:none;border-color:var(--red)}
.macts{display:flex;gap:9px;margin-top:6px}
.btn{flex:1;font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:12px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--chalk)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.resetbtn{display:block;margin:30px auto 0;background:transparent;border:1px solid var(--line);color:var(--dim);
  font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer}
.resetbtn:hover{color:var(--red);border-color:var(--red)}
</style>
</head>

<header><div class="wrap">
  <div class="hbar">
    <div>
      <div class="title">СРЦ<span class="red">·</span>14</div>
      <div class="sub">Саморозрахований цикл · троєборство · Д. Головинський</div>
    </div>
    <div class="cyclechip" id="runchip">Прогон 1</div>
  </div>
  <div class="pmstrip" id="pmstrip"></div>

</div></div>

const GROWTH = 0.005;           // +0.5% ПМ за мікроцикл (AH58)
const GRP_COLOR = {'ПР':'#d8453a','ЖМ':'#5b8bd0','ТГ':'#e3a23a','ЗФП':'#52a575'};
const SESS_TITLE = ['Тренування 1','Тренування 2','Тренування 3'];
const KEY='src14_state_v1';

let state = load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pm)return s;}catch(e){}
  return {pm:{sq:100,bp:90,dl:130}, run:1, done:{}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function mround(v,step){return Math.round(v/step)*step;}
function pmFor(base,mc){return state.pm[base]*Math.pow(1+GROWTH,mc);} // mc 0-indexed
function weight(ex,mc){
  // returns array of {kg,reps,sets,pct,heavy} per set-group
  const pm = pmFor(ex.base,mc)*ex.factor;
  const step = ex.mult===2?1:2.5;
  return ex.sets.map(([p,r,s])=>({kg:mround(pm*p,step),reps:r,sets:s,pct:Math.round(p*100),heavy:p>=0.78}));
}

let view='overview';
function render(){
  renderPM(); renderNav();
  const c=document.getElementById('content');
  c.innerHTML = view==='overview'? overviewHTML() : mcHTML(parseInt(view));
  if(view==='overview'){drawWave(curChart);bindTabs();}
  bindSets();
}

function renderPM(){
  const s=document.getElementById('pmstrip');
  const items=[['sq','Присід'],['bp','Жим'],['dl','Тяга']];
  s.innerHTML = items.map(([k,l])=>`<div class="pm"><div class="lab">${l}</div><div class="val">${state.pm[k]}<small> кг</small></div></div>`).join('')
    + `<button class="editpm" onclick="openModal()">✎ Змінити ПМ</button>`;
  document.getElementById('runchip').textContent='Прогон '+state.run;
}

function mcProgress(mc){
  let tot=0,dn=0;
  PROGRAM[mc].forEach((sess,si)=>sess.forEach((ex,ei)=>ex.sets.forEach((_,gi)=>{
    tot++; if(state.done[`${state.run}.${mc}.${si}.${ei}.${gi}`])dn++;
  })));
  return {tot,dn};
}

function renderNav(){
  const n=document.getElementById('nav');
  let h=`<button class="nb ${view==='overview'?'active':''}" onclick="go('overview')">Огляд</button>`;
  for(let i=0;i<6;i++){
    const peak=i===4, deload=i===5;
    const cls=(view==String(i)?'active ':'')+(peak?'peak':deload?'deload':'');
    const dot = peak?'background:var(--amber)':deload?'background:var(--green)':'background:var(--dim)';
    h+=`<button class="nb ${cls}" onclick="go('${i}')">МЦ ${i+1}<span class="dotmark" style="${dot}"></span></button>`;
  }
  n.innerHTML=h;
}
function go(v){view=v;window.scrollTo(0,0);render();}

  const peak=mc===4,deload=mc===5;

      const W=weight(ex,mc);
      const gc=GRP_COLOR[ex.grp]||'#5b636e';
      h+=`<div class="ex"><div class="exhead">
        <span class="exname">${ex.name}</span>
        <span class="exgrp" style="background:${gc}">${ex.grp}</span>
        <span class="exload">${ex.load}</span></div><div class="sets">`;
      W.forEach((w,gi)=>{
        const id=`${state.run}.${mc}.${si}.${ei}.${gi}`;
        const done=state.done[id]?'done':'';
        const hv=w.heavy?'heavy':'';
        const unit=ex.mult===2?' <small>×2</small>':'';
        h+=`<div class="setbox ${done} ${hv}" data-id="${id}">
          <span class="ck">✓</span>
          <span><span class="kg">${w.kg}<small> кг</small>${unit}</span><br>
          <span class="rs">${w.reps}×${w.sets}</span> <span class="pc">${w.pct}%</span></span>
        </div>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

function bindSets(){
  document.querySelectorAll('.setbox').forEach(b=>{
    b.onclick=()=>{const id=b.dataset.id;state.done[id]=!state.done[id];if(!state.done[id])delete state.done[id];save();b.classList.toggle('done');};
  });
}

/* ---- wave chart ---- */
let curChart='sq';
function maxPctByMC(base){
  return PROGRAM.map(mc=>{
    let m=0; mc.forEach(s=>s.forEach(ex=>{if(ex.base===base&&ex.factor===1)ex.sets.forEach(([p])=>{if(p>m)m=p;});}));
    return Math.round(m*100);
  });
}
function bindTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    curChart=t.dataset.c;
    document.querySelectorAll('.tab').forEach(x=>{x.classList.remove('active');x.style.color=x.dataset.c==='sq'?'#d8453a':x.dataset.c==='bp'?'#5b8bd0':'#e3a23a';x.style.background='transparent';});
    t.classList.add('active');t.style.color='var(--bg)';
    t.style.background=curChart==='sq'?'#d8453a':curChart==='bp'?'#5b8bd0':'#e3a23a';
    drawWave(curChart);
  });
}
function drawWave(base){
  const cv=document.getElementById('wave');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=300;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  g.clearRect(0,0,W,H);
  const col=base==='sq'?'#d8453a':base==='bp'?'#5b8bd0':'#e3a23a';
  const data=maxPctByMC(base);
  const pad={l:34,r:14,t:18,b:34}, cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const mn=30,mx=90;
  const X=i=>pad.l+cw*(i/5), Y=v=>pad.t+ch*(1-(v-mn)/(mx-mn));
  g.strokeStyle='#2b323c';g.lineWidth=1;g.fillStyle='#5b636e';g.font="11px 'JetBrains Mono'";g.textAlign='right';
  [40,50,60,70,80,90].forEach(v=>{g.beginPath();g.moveTo(pad.l,Y(v));g.lineTo(W-pad.r,Y(v));g.stroke();g.fillText(v+'%',pad.l-6,Y(v)+4);});
  // peak/deload bands
  g.fillStyle='rgba(227,162,58,.08)';g.fillRect(X(4)-cw/12,pad.t,cw/6,ch);
  g.fillStyle='rgba(82,165,117,.08)';g.fillRect(X(5)-cw/12,pad.t,cw/6,ch);
  // line
  g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();
  data.forEach((v,i)=>{i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));});g.stroke();
  data.forEach((v,i)=>{
    g.fillStyle=i===4?'#e3a23a':i===5?'#52a575':col;
    g.beginPath();g.arc(X(i),Y(v),4.5,0,7);g.fill();
    g.fillStyle='#e9e7e1';g.font="700 12px 'JetBrains Mono'";g.textAlign='center';
    g.fillText(v+'%',X(i),Y(v)-11);
    g.fillStyle='#878f9b';g.font="11px 'Oswald'";g.fillText('МЦ'+(i+1),X(i),H-12);
  });
}

/* ---- modal & runs ---- */
function openModal(){document.getElementById('i_sq').value=state.pm.sq;document.getElementById('i_bp').value=state.pm.bp;document.getElementById('i_dl').value=state.pm.dl;document.getElementById('overlay').classList.add('on');}
function closeModal(){document.getElementById('overlay').classList.remove('on');}
function savePM(){
  state.pm.sq=+document.getElementById('i_sq').value||state.pm.sq;
  state.pm.bp=+document.getElementById('i_bp').value||state.pm.bp;
  state.pm.dl=+document.getElementById('i_dl').value||state.pm.dl;
  save();closeModal();render();
}
function nextRun(){
  if(!confirm('Завершити поточний прогон? Стартові ПМ зростуть на 1.005⁶ (~+3%), відмітки збережуться окремо.'))return;
  const f=Math.pow(1+GROWTH,6);
  state.pm.sq=mround(state.pm.sq*f,2.5);state.pm.bp=mround(state.pm.bp*f,2.5);state.pm.dl=mround(state.pm.dl*f,2.5);
  state.run++;save();go('overview');
}
function hardReset(){
  if(!confirm('Скинути всі відмітки поточного прогону?'))return;
  Object.keys(state.done).forEach(k=>{if(k.startsWith(state.run+'.'))delete state.done[k];});
  save();render();
}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
window.addEventListener('resize',()=>{if(view==='overview')drawWave(curChart);});
render();
</script>
