<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мої СРЦ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1b2027; --panel2:#20262f; --line:#2b323c;
  --chalk:#e9e7e1; --muted:#878f9b; --dim:#5b636e;
  --red:#d8453a; --amber:#e3a23a; --green:#52a575; --blue:#5b8bd0; --purple:#9b7fd0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--chalk);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171b21,#14171c)}
.hbar{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 0 16px;gap:16px;flex-wrap:wrap}
.title{font-family:'Oswald';font-weight:700;font-size:clamp(26px,6vw,42px);letter-spacing:.02em;line-height:.95;text-transform:uppercase}
.title .red{color:var(--red)} .title .blue{color:var(--blue)}
.sub{color:var(--muted);font-size:12.5px;margin-top:5px;letter-spacing:.03em}
.progtabs{display:flex;gap:8px;padding:0 0 16px}
.progtab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-family:'Oswald';
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:11px;border-radius:10px;cursor:pointer;text-align:center}
.progtab.active{color:var(--chalk);border-color:var(--red)}
.progtab.active.p15{border-color:var(--blue)}
.pmstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 0 18px}
.pm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:104px}
.pm .lab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.pm .val{font-family:'Oswald';font-weight:700;font-size:24px;line-height:1.1}
.pm .val small{font-size:13px;color:var(--dim);font-weight:500}
.editpm{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--chalk);
  font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer}
.editpm:hover{border-color:var(--red)}
nav{position:sticky;top:0;z-index:30;background:rgba(20,23,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;max-width:880px;margin:0 auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;background:transparent;border:none;color:var(--muted);font-family:'Oswald';font-size:13.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.nb.active{background:var(--panel2);color:var(--chalk)}
main{padding-top:20px}
.viewhead{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.lead{font-size:14.5px;color:#c3c8d0;max-width:680px;margin-bottom:20px}
.session{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.snum{font-family:'Oswald';font-weight:700;font-size:14px;background:var(--bg);border:1px solid var(--line);
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stitle{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.ex{padding:12px 16px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex.acc{background:rgba(155,127,208,.04)}
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.exname{font-weight:600;font-size:14.5px}
.exgrp{font-family:'Oswald';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);padding:2px 6px;border-radius:4px;font-weight:600}
.exnote{font-size:10.5px;color:var(--dim);font-style:italic}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.setbox{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.setbox:hover{border-color:var(--muted)}
.setbox.done{border-color:var(--green);background:rgba(82,165,117,.09)}
.setbox .ck{width:16px;height:16px;border:1.5px solid var(--dim);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.setbox.done .ck{border-color:var(--green);background:var(--green);color:#fff}
.setbox .kg{font-family:'Oswald';font-weight:700;font-size:17px;line-height:1}
.setbox .kg small{font-size:10px;color:var(--dim);font-weight:500}
.setbox .rs{font-family:'JetBrains Mono';font-size:11px;color:var(--muted)}
.setbox.heavy .kg{color:var(--amber)}
.accbox{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:7px 10px}
.accbox .rs{font-family:'JetBrains Mono';font-size:12px;color:var(--purple)}
.overlay{position:fixed;inset:0;background:rgba(8,10,13,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px}
.modal h3{font-family:'Oswald';font-weight:700;font-size:22px;text-transform:uppercase;margin-bottom:4px}
.modal .hint{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.45}
.fld{margin-bottom:14px}
.fld label{display:block;font-family:'Oswald';font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--chalk);font-family:'JetBrains Mono';font-size:18px;font-weight:700;padding:11px 13px;border-radius:9px}
.fld input:focus{outline:none;border-color:var(--red)}
.macts{display:flex;gap:9px;margin-top:6px}
.btn{flex:1;font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:12px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--chalk)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.notebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#c3c8d0}
.notebox b{color:var(--chalk)}

.phasebar{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.phasebar div{flex:1;text-align:center;font-family:'Oswald';font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 2px;color:var(--bg);font-weight:600}
.legendrow{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 26px}
.legendrow b{color:var(--chalk);font-weight:600}
.wavewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 14px 10px;margin-bottom:26px}
.wavetitle{font-family:'Oswald';font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px 8px}
.tabs{display:flex;gap:6px;padding:0 4px 12px}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'Oswald';
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:7px;cursor:pointer}
.tab.active{border-color:transparent;color:var(--bg);font-weight:600}
canvas{width:100%;height:auto;display:block}
.pattern{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:26px}
@media(min-width:620px){.pattern{grid-template-columns:1fr 1fr}
.pcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:14px 16px}
.pcard h4{font-family:'Oswald';font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.pcard p{font-size:13.5px;color:#b9bec7}
.pcard .f{font-family:'JetBrains Mono';font-size:12.5px;color:var(--amber);margin-top:7px;display:block}
.mcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.mctile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:.12s}
.mctile:hover{border-color:var(--muted)}
.mctile .n{font-family:'Oswald';font-weight:700;font-size:20px}
.mctile .ring{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);margin-top:3px}
.mctile.done{border-color:var(--green)}
.resetbtn{display:block;margin:30px auto 0;background:transparent;border:1px solid var(--line);color:var(--dim);
  font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer}
.resetbtn:hover{color:var(--red);border-color:var(--red)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hbar">
    <div>
      <div class="title"><span id="titleMain">ТРОЄБОРСТВО</span></div>
      <div class="sub" id="subMain">Троєборство</div>
    </div>
  </div>
  <div class="progtabs">
    <button class="progtab" id="tabP14" onclick="switchProgram('p14')">СРЦ-14 · Троєборство</button>
    <button class="progtab" id="tabP15" onclick="switchProgram('p15')">СРЦ-15 · Жим (модиф.)</button>
  </div>
  <div class="pmstrip" id="pmstrip"></div>
</div></header>

<nav><div class="navin" id="nav"></div></nav>
<main><div class="wrap" id="content"></div></main>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

function switchProgram(p){

  render();
}

/* ================= СРЦ14 (troeborye) ================= */
function pmFor14(base,mc){return state14.pm[base]*Math.pow(1+GROWTH,mc);}
function weight14(ex,mc){
  const pm = pmFor14(ex.base,mc)*ex.factor;
  const step = ex.mult===2?1:2.5;
  return ex.sets.map(([p,r,s])=>({kg:mround(pm*p,step),reps:r,sets:s,pct:Math.round(p*100),heavy:p>=0.78}));
}
function render14PM(){
  const items=[['sq','Присід'],['bp','Жим'],['dl','Тяга']];
  document.getElementById('pmstrip').innerHTML = items.map(([k,l])=>`<div class="pm"><div class="lab">${l}</div><div class="val">${state14.pm[k]}<small> кг</small></div></div>`).join('')

}

  for(let i=0;i<6;i++) h+=`<button class="nb ${view14==String(i)?'active':''}" onclick="go14('${i}')">МЦ ${i+1}</button>`;
  document.getElementById('nav').innerHTML=h;
}
function go14(v){view14=v;window.scrollTo(0,0);render();}

let curChart='sq';
function mcProgress14(mc){
  let tot=0,dn=0;
  PROGRAM14[mc].forEach((sess,si)=>sess.forEach((ex,ei)=>ex.sets.forEach((_,gi)=>{
    tot++; if(state14.done[`${state14.run}.${mc}.${si}.${ei}.${gi}`])dn++;
  })));
  return {tot,dn};
}

function maxPctByMC14(base){
  return PROGRAM14.map(mc=>{
    let m=0; mc.forEach(s=>s.forEach(ex=>{if(ex.base===base&&ex.factor===1)ex.sets.forEach(([p])=>{if(p>m)m=p;});}));
    return Math.round(m*100);
  });
}

    document.querySelectorAll('.tab').forEach(x=>{x.classList.remove('active');x.style.color=x.dataset.c==='sq'?'#d8453a':x.dataset.c==='bp'?'#5b8bd0':'#e3a23a';x.style.background='transparent';});
    t.classList.add('active');t.style.color='var(--bg)';
    t.style.background=curChart==='sq'?'#d8453a':curChart==='bp'?'#5b8bd0':'#e3a23a';
    drawWave14(curChart);
  });
}

function drawWave14(base){
  const cv=document.getElementById('wave');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=300;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  g.clearRect(0,0,W,H);
  const col=base==='sq'?'#d8453a':base==='bp'?'#5b8bd0':'#e3a23a';
  const data=maxPctByMC14(base);
  const pad={l:34,r:14,t:18,b:34}, cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const mn=30,mx=90;
  const X=i=>pad.l+cw*(i/5), Y=v=>pad.t+ch*(1-(v-mn)/(mx-mn));
  g.strokeStyle='#2b323c';g.lineWidth=1;g.fillStyle='#5b636e';g.font="11px 'JetBrains Mono'";g.textAlign='right';
  [40,50,60,70,80,90].forEach(v=>{g.beginPath();g.moveTo(pad.l,Y(v));g.lineTo(W-pad.r,Y(v));g.stroke();g.fillText(v+'%',pad.l-6,Y(v)+4);});
  // peak/deload bands
  g.fillStyle='rgba(227,162,58,.08)';g.fillRect(X(4)-cw/12,pad.t,cw/6,ch);
  g.fillStyle='rgba(82,165,117,.08)';g.fillRect(X(5)-cw/12,pad.t,cw/6,ch);
  // line
  g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();
  data.forEach((v,i)=>{i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));});g.stroke();
  data.forEach((v,i)=>{
    g.fillStyle=i===4?'#e3a23a':i===5?'#52a575':col;
    g.beginPath();g.arc(X(i),Y(v),4.5,0,7);g.fill();
    g.fillStyle='#e9e7e1';g.font="700 12px 'JetBrains Mono'";g.textAlign='center';
    g.fillText(v+'%',X(i),Y(v)-11);
    g.fillStyle='#878f9b';g.font="11px 'Oswald'";g.fillText('МЦ'+(i+1),X(i),H-12);
  });
}
function nextRun14(){
  if(!confirm('Завершити поточний прогон? Стартові ПМ зростуть на 1.005⁶ (~+3%), відмітки збережуться окремо.'))return;
  const f=Math.pow(1+GROWTH,6);
  state14.pm.sq=mround(state14.pm.sq*f,2.5);state14.pm.bp=mround(state14.pm.bp*f,2.5);state14.pm.dl=mround(state14.pm.dl*f,2.5);
  state14.run++;save14();go14('overview');
}
function hardReset14(){
  if(!confirm('Скинути всі відмітки поточного прогону?'))return;
  Object.keys(state14.done).forEach(k=>{if(k.startsWith(state14.run+'.'))delete state14.done[k];});
  save14();render();
}

function content14(){
  if(view14==='overview'){
    return overviewHTML14();
  }
  const mc=parseInt(view14);
  let h=`<div class="viewhead">Мікроцикл ${mc+1}</div>`;
  const SESS_TITLE=['Тренування 1','Тренування 2','Тренування 3'];
  PROGRAM14[mc].forEach((sess,si)=>{
    h+=`<div class="session"><div class="shead"><div class="snum">Т${si+1}</div><div class="stitle">${SESS_TITLE[si]}</div></div>`;
    sess.forEach((ex,ei)=>{
      const W=weight14(ex,mc); const gc=GRP_COLOR[ex.grp]||'#5b636e';
      h+=`<div class="ex"><div class="exhead"><span class="exname">${ex.name}</span><span class="exgrp" style="background:${gc}">${ex.grp}</span></div><div class="sets">`;
      W.forEach((w,gi)=>{
        const id=`${state14.run}.${mc}.${si}.${ei}.${gi}`;
        const done=state14.done[id]?'done':''; const hv=w.heavy?'heavy':'';
        h+=`<div class="setbox ${done} ${hv}" data-p="14" data-id="${id}"><span class="ck">✓</span><span><span class="kg">${w.kg}<small> кг</small></span><br><span class="rs">${w.reps}×${w.sets}</span></span></div>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* ================= СРЦ15 (bench, modified) ================= */
function pmFor15(mc){return state15.pm.bp*Math.pow(1+GROWTH,mc);}
function render15PM(){
  document.getElementById('pmstrip').innerHTML =
    `<div class="pm"><div class="lab">Жим</div><div class="val">${state15.pm.bp}<small> кг</small></div></div>`+
    `<button class="editpm" onclick="openModal15()">✎ Змінити ПМ</button>`;
}
function render15Nav(){
  let h='';
  for(let i=0;i<12;i++) h+=`<button class="nb ${view15===i?'active':''}" onclick="go15(${i})">Тиждень ${i+1}</button>`;
  document.getElementById('nav').innerHTML=h;
}
function go15(v){view15=v;window.scrollTo(0,0);render();}
function content15(){
  const mc=view15;
  const week=PROGRAM15[mc];
  const DAY_TITLE = {t1:"День 1 · Жим (важкий)", t2:"День 2 · Загальний", t3:"День 3 · Жим + дельти"};
  let h=`<div class="viewhead">Тиждень ${mc+1} з 12 · ПМ жиму цього тижня: ${Math.round(pmFor15(mc))} кг</div>`;
  h+=`<div class="notebox">Присід і тяга виключені (реабілітація коліна). Вправи з фіолетовим пунктиром — додано зверх оригінального СРЦ15, вага за відчуттям.</div>`;
  ['t1','t2','t3'].forEach((day,di)=>{
    h+=`<div class="session"><div class="shead"><div class="snum">Д${di+1}</div><div class="stitle">${DAY_TITLE[day]}</div></div>`;
    week[day].forEach((ex,ei)=>{
      const gc=GRP_COLOR[ex.grp]||'#5b636e';
      h+=`<div class="ex ${ex.kind==='acc'?'acc':''}"><div class="exhead"><span class="exname">${ex.name}</span><span class="exgrp" style="background:${gc}">${ex.grp}</span>${ex.kind==='acc'?'<span class="exnote">додано</span>':''}</div><div class="sets">`;
      if(ex.kind==='main'){
        ex.sets.forEach((w,gi)=>{
          const id=`${mc}.${day}.${ei}.${gi}`;
          const done=state15.done[id]?'done':''; const hv=w.pct>=78?'heavy':'';
          const unit=ex.mult===2?' <small>×2</small>':'';
          h+=`<div class="setbox ${done} ${hv}" data-p="15" data-id="${id}"><span class="ck">✓</span><span><span class="kg">${w.kg}<small> кг</small>${unit}</span><br><span class="rs">${w.reps}×${w.cnt}</span></span></div>`;
        });
      } else {
        for(let gi=0; gi<ex.sets_count; gi++){
          const id=`${mc}.${day}.${ei}.${gi}`;
          const done=state15.done[id]?'done':'';
          h+=`<div class="setbox ${done}" data-p="15" data-id="${id}" style="border-style:dashed"><span class="ck">✓</span><span class="rs">${ex.reps_range} повт</span></div>`;
        }
      }
      h+=`</div></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* ---------- common render ---------- */
function render(){
  if(curProgram==='p14'){
    document.getElementById('tabP14').classList.add('active');
    document.getElementById('tabP15').classList.remove('active','p15');
    render14PM(); render14Nav();
    document.getElementById('content').innerHTML = content14();
    if(view14==='overview'){drawWave14(curChart);bindTabs14();}
  } else {
    document.getElementById('tabP15').classList.add('active','p15');
    document.getElementById('tabP14').classList.remove('active');
    render15PM(); render15Nav();
    document.getElementById('content').innerHTML = content15();
  }
  bindSets();
}
function bindSets(){
  document.querySelectorAll('.setbox').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.id;
      if(b.dataset.p==='14'){ state14.done[id]=!state14.done[id]; if(!state14.done[id])delete state14.done[id]; save14(); }
      else { state15.done[id]=!state15.done[id]; if(!state15.done[id])delete state15.done[id]; save15(); }
      b.classList.toggle('done');
    };
  });
}

/* ---------- modals ---------- */
function openModal14(){
  document.getElementById('modalBody').innerHTML = `
    <h3>Твої 1ПМ · СРЦ14</h3>
    <p class="hint">Разові максимуми в трьох рухах.</p>
    <div class="fld"><label>Присідання, кг</label><input type="number" id="i_sq" step="2.5" value="${state14.pm.sq}"></div>
    <div class="fld"><label>Жим лежа, кг</label><input type="number" id="i_bp" step="2.5" value="${state14.pm.bp}"></div>
    <div class="fld"><label>Станова тяга, кг</label><input type="number" id="i_dl" step="2.5" value="${state14.pm.dl}"></div>
    <div class="macts"><button class="btn" onclick="closeModal()">Скасувати</button><button class="btn primary" onclick="savePM14()">Зберегти</button></div>`;
  document.getElementById('overlay').classList.add('on');
}
function savePM14(){
  state14.pm.sq=+document.getElementById('i_sq').value||state14.pm.sq;
  state14.pm.bp=+document.getElementById('i_bp').value||state14.pm.bp;
  state14.pm.dl=+document.getElementById('i_dl').value||state14.pm.dl;
  save14(); closeModal(); render();
}
function openModal15(){
  document.getElementById('modalBody').innerHTML = `
    <h3>Твій 1ПМ · СРЦ15</h3>
    <p class="hint">Разовий максимум у жимі лежа. Присід і тяга в цьому циклі виключені.</p>
    <div class="fld"><label>Жим лежа, кг</label><input type="number" id="i_bp15" step="2.5" value="${state15.pm.bp}"></div>
    <div class="macts"><button class="btn" onclick="closeModal()">Скасувати</button><button class="btn primary" onclick="savePM15()">Зберегти</button></div>`;
  document.getElementById('overlay').classList.add('on');
}
function savePM15(){
  state15.pm.bp=+document.getElementById('i_bp15').value||state15.pm.bp;
  save15(); closeModal(); render();
}
function closeModal(){document.getElementById('overlay').classList.remove('on');}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};

render();
</script>
